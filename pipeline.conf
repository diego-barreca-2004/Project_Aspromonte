# pipeline.conf - shared reconstruction contract for Project Aspromonte.
# Both epochs run from THIS file, so they are reconstructed identically (like-with-like).
# Format: "key value", one per line, # starts a comment. Used by run_pipeline.py.

# --- tools -------------------------------------------------------------------
colmap          colmap            # MUST be the Blackwell arch-89 build (see build_colmap_cuda.md)
python          python3

# --- per-camera / per-project inputs (reused across epochs) ------------------
calibration     ./calib_out/calibration_fisheye.json
dtm             ./aspromonte_dtm_utm33n.tif
epsg            32633

# --- reconstruction contract (identical for EVERY epoch - do not vary) -------
every_sec       0.2
jpeg_quality    95
longest_side    1600              # ingest downscale (px) - REQUIRED, no default; ep1 baseline
matcher         sequential
max_image_size  1000
sor_iters       2
sor_k           20
sor_std         2.0

# --- splat (Track 1) ---------------------------------------------------------
splat           true
gs_train        ./gaussian-splatting/train.py
gs_iterations   30000
gs_extra_args   --data_device cpu # execution strategy: images in RAM, not VRAM (12GB card)

# --- QC gate thresholds (halt the run if breached) ---------------------------
# sfm: registered images must be a large fraction of the extracted frames
min_images            50
min_reg_ratio         0.80
# geo: Sim3 fit vs GPS - epoch 1 was 552/603 (0.92) at 0.180 m; halt well before that degrades
min_geo_inlier_ratio  0.70
max_geo_residual      0.60
# dense: fused point count (0-ish means the Blackwell codegen bug)
min_dense_points      100000
# georef: floater-inflated clouds blow up the vertical extent (epoch 1: ~49 m)
max_vertical_extent   200
# georef: UTM centroid sanity box for the seg01 area (EPSG:32633). Widen for other sites.
utm_e_min             550000
utm_e_max             570000
utm_n_min             4200000
utm_n_max             4230000