<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box  { fill: #f4f6f8; stroke: #8a96a3; stroke-width: 1.2; }
      .new  { fill: #e8f1fb; stroke: #3b78b5; stroke-width: 1.4; }
      .t1   { fill: #f6f0fa; stroke: #8a63a8; stroke-width: 1.2; }
      .t2   { fill: #eef7ee; stroke: #4c8c4a; stroke-width: 1.2; }
      .ttl  { font-size: 13px; font-weight: bold; fill: #1d2733; }
      .sub  { font-size: 11px; fill: #3c4753; }
      .scr  { font-size: 10px; fill: #5b6672; font-family: Menlo, Consolas, monospace; }
      .lbl  { font-size: 12px; font-weight: bold; fill: #5b6672; letter-spacing: 0.5px; }
      .ln   { stroke: #555; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1040" height="320" fill="#ffffff"/>

  <text x="16" y="24" class="lbl">SHARED FRONT-END (one run per epoch)</text>

  <rect x="16" y="36" width="140" height="92" rx="8" class="box"/>
  <text x="86" y="58" text-anchor="middle" class="ttl">GoPro HERO13</text>
  <text x="86" y="76" text-anchor="middle" class="sub">5.3K 8:7 Wide, chest</text>
  <text x="86" y="92" text-anchor="middle" class="sub">video + telemetry</text>
  <text x="86" y="116" text-anchor="middle" class="scr">calibrate_camera.py</text>

  <rect x="176" y="36" width="160" height="92" rx="8" class="box"/>
  <text x="256" y="58" text-anchor="middle" class="ttl">Ingest</text>
  <text x="256" y="76" text-anchor="middle" class="sub">frames every 0.2 s</text>
  <text x="256" y="92" text-anchor="middle" class="sub">GPS + gravity per frame</text>
  <text x="256" y="116" text-anchor="middle" class="scr">ingest_gopro.py</text>

  <rect x="356" y="36" width="220" height="92" rx="8" class="new"/>
  <text x="466" y="58" text-anchor="middle" class="ttl">Structure-from-Motion</text>
  <text x="466" y="76" text-anchor="middle" class="sub">COLMAP incremental, or</text>
  <text x="466" y="92" text-anchor="middle" class="sub">global (GLOMAP) with gravity priors</text>
  <text x="466" y="116" text-anchor="middle" class="scr">run_colmap.py / compare_mappers.py</text>

  <rect x="596" y="36" width="200" height="92" rx="8" class="new"/>
  <text x="696" y="58" text-anchor="middle" class="ttl">Georeferencing</text>
  <text x="696" y="76" text-anchor="middle" class="sub">GPS Sim3, or gravity-levelled</text>
  <text x="696" y="92" text-anchor="middle" class="sub">4-DoF fit (heading, scale, t)</text>
  <text x="696" y="116" text-anchor="middle" class="scr">geo_align.py</text>

  <rect x="816" y="36" width="208" height="92" rx="8" class="box"/>
  <text x="920" y="58" text-anchor="middle" class="ttl">ICP to LiDAR DTM</text>
  <text x="920" y="76" text-anchor="middle" class="sub">open 1 m DTM, UTM 33N</text>
  <text x="920" y="92" text-anchor="middle" class="sub">ground points only</text>
  <text x="920" y="116" text-anchor="middle" class="scr">georef_splat.py</text>

  <path d="M156,82 L174,82" class="ln"/>
  <path d="M336,82 L354,82" class="ln"/>
  <path d="M576,82 L594,82" class="ln"/>
  <path d="M796,82 L814,82" class="ln"/>

  <path d="M466,128 L466,156 L116,156 L116,188" class="ln"/>
  <path d="M466,156 L576,156 L576,188" class="ln"/>

  <text x="128" y="182" class="lbl">TRACK 1: NAVIGABLE SPLAT</text>
  <rect x="16" y="190" width="200" height="74" rx="8" class="t1"/>
  <text x="116" y="212" text-anchor="middle" class="ttl">3D Gaussian Splatting</text>
  <text x="116" y="230" text-anchor="middle" class="sub">Inria 3DGS, 30k iterations</text>
  <text x="116" y="252" text-anchor="middle" class="scr">train.py (external)</text>
  <rect x="236" y="190" width="200" height="74" rx="8" class="t1"/>
  <text x="336" y="212" text-anchor="middle" class="ttl">Georeferenced splat</text>
  <text x="336" y="230" text-anchor="middle" class="sub">UTM splat + local view.ply</text>
  <text x="336" y="252" text-anchor="middle" class="scr">georef_splat.py</text>
  <path d="M216,227 L234,227" class="ln"/>

  <text x="588" y="182" class="lbl">TRACK 2: CHANGE DETECTION BETWEEN EPOCHS</text>
  <rect x="496" y="190" width="160" height="74" rx="8" class="t2"/>
  <text x="576" y="212" text-anchor="middle" class="ttl">Dense MVS</text>
  <text x="576" y="230" text-anchor="middle" class="sub">COLMAP CUDA, float64 UTM</text>
  <text x="576" y="252" text-anchor="middle" class="scr">georef_cloud.py</text>
  <rect x="676" y="190" width="170" height="74" rx="8" class="t2"/>
  <text x="761" y="212" text-anchor="middle" class="ttl">Epoch vs epoch</text>
  <text x="761" y="230" text-anchor="middle" class="sub">ICP, then M3C2</text>
  <text x="761" y="252" text-anchor="middle" class="scr">run_m3c2.py</text>
  <rect x="866" y="190" width="158" height="74" rx="8" class="t2"/>
  <text x="945" y="212" text-anchor="middle" class="ttl">Object candidates</text>
  <text x="945" y="230" text-anchor="middle" class="sub">DSM difference</text>
  <text x="945" y="252" text-anchor="middle" class="scr">dsm_change.py</text>
  <path d="M656,227 L674,227" class="ln"/>
  <path d="M846,227 L864,227" class="ln"/>

  <rect x="16" y="288" width="14" height="14" rx="3" class="new"/>
  <text x="38" y="299" class="sub">stages compared in this repository: incremental vs global SfM, GPS-only vs gravity-levelled georeferencing (compare_mappers.py)</text>
</svg>
