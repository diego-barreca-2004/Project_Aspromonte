<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box  { fill: #f4f6f8; stroke: #8a96a3; stroke-width: 1.2; }
      .new  { fill: #e8f1fb; stroke: #3b78b5; stroke-width: 1.4; }
      .t1   { fill: #f6f0fa; stroke: #8a63a8; stroke-width: 1.2; }
      .t2   { fill: #eef7ee; stroke: #4c8c4a; stroke-width: 1.2; }
      .nul  { fill: #ffffff; stroke: #4c8c4a; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .ttl  { font-size: 13px; font-weight: bold; fill: #1d2733; }
      .sub  { font-size: 11px; fill: #3c4753; }
      .scr  { font-size: 10px; fill: #5b6672; font-family: Menlo, Consolas, monospace; }
      .lbl  { font-size: 12px; font-weight: bold; fill: #5b6672; letter-spacing: 0.5px; }
      .ln   { stroke: #555; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1040" height="400" fill="#ffffff"/>

  <text x="16" y="24" class="lbl">SHARED FRONT-END (one run per pass)</text>

  <rect x="16" y="36" width="140" height="92" rx="8" class="box"/>
  <text x="86" y="58" text-anchor="middle" class="ttl">GoPro HERO13</text>
  <text x="86" y="76" text-anchor="middle" class="sub">5.3K 8:7 Wide, handheld</text>
  <text x="86" y="92" text-anchor="middle" class="sub">video + telemetry</text>
  <text x="86" y="116" text-anchor="middle" class="scr">calibrate_camera.py</text>

  <rect x="176" y="36" width="160" height="92" rx="8" class="box"/>
  <text x="256" y="58" text-anchor="middle" class="ttl">Ingest</text>
  <text x="256" y="76" text-anchor="middle" class="sub">frames every 0.2 s</text>
  <text x="256" y="92" text-anchor="middle" class="sub">GPS + gravity per frame</text>
  <text x="256" y="116" text-anchor="middle" class="scr">ingest_gopro.py</text>

  <rect x="356" y="36" width="220" height="92" rx="8" class="new"/>
  <text x="466" y="58" text-anchor="middle" class="ttl">Structure-from-Motion</text>
  <text x="466" y="76" text-anchor="middle" class="sub">COLMAP incremental, or</text>
  <text x="466" y="92" text-anchor="middle" class="sub">global (GLOMAP) with gravity priors</text>
  <text x="466" y="116" text-anchor="middle" class="scr">run_colmap.py / compare_mappers.py</text>

  <rect x="596" y="36" width="200" height="92" rx="8" class="new"/>
  <text x="696" y="58" text-anchor="middle" class="ttl">Georeferencing</text>
  <text x="696" y="76" text-anchor="middle" class="sub">GPS Sim3, or gravity-levelled</text>
  <text x="696" y="92" text-anchor="middle" class="sub">4-DoF fit (heading, scale, t)</text>
  <text x="696" y="116" text-anchor="middle" class="scr">geo_align.py</text>

  <rect x="816" y="36" width="208" height="92" rx="8" class="box"/>
  <text x="920" y="58" text-anchor="middle" class="ttl">ICP to LiDAR DTM</text>
  <text x="920" y="76" text-anchor="middle" class="sub">open 1 m DTM, UTM 33N</text>
  <text x="920" y="92" text-anchor="middle" class="sub">ground points only</text>
  <text x="920" y="116" text-anchor="middle" class="scr">georef_splat.py</text>

  <path d="M156,82 L174,82" class="ln"/>
  <path d="M336,82 L354,82" class="ln"/>
  <path d="M576,82 L594,82" class="ln"/>
  <path d="M796,82 L814,82" class="ln"/>

  <path d="M256,128 L256,156 L105,156 L105,188" class="ln"/>
  <path d="M466,128 L466,156 L726,156 L726,188" class="ln"/>

  <text x="118" y="182" class="lbl">TRACK 2: CHANGE BETWEEN PASSES</text>
  <rect x="16" y="190" width="178" height="88" rx="8" class="t2"/>
  <text x="105" y="212" text-anchor="middle" class="ttl">Co-aligned SfM</text>
  <text x="105" y="232" text-anchor="middle" class="sub">all passes in one model,</text>
  <text x="105" y="247" text-anchor="middle" class="sub">one Sim3 to their GPS</text>
  <text x="105" y="268" text-anchor="middle" class="scr">coalign.py</text>
  <rect x="216" y="190" width="178" height="88" rx="8" class="t2"/>
  <text x="305" y="212" text-anchor="middle" class="ttl">Dense cloud per pass</text>
  <text x="305" y="232" text-anchor="middle" class="sub">common poses, one UTM frame,</text>
  <text x="305" y="247" text-anchor="middle" class="sub">compared without ICP</text>
  <text x="305" y="268" text-anchor="middle" class="scr">coalign.py, georef_cloud.py</text>
  <rect x="416" y="190" width="178" height="88" rx="8" class="t2"/>
  <text x="505" y="212" text-anchor="middle" class="ttl">Change in the heights</text>
  <text x="505" y="232" text-anchor="middle" class="sub">DSM difference,</text>
  <text x="505" y="247" text-anchor="middle" class="sub">a-contrario windows</text>
  <text x="505" y="268" text-anchor="middle" class="scr">measure_change.py</text>
  <rect x="216" y="300" width="178" height="88" rx="8" class="t2"/>
  <text x="305" y="322" text-anchor="middle" class="ttl">Change in the images</text>
  <text x="305" y="342" text-anchor="middle" class="sub">reference views warped into</text>
  <text x="305" y="357" text-anchor="middle" class="sub">the new frames, a-contrario</text>
  <text x="305" y="378" text-anchor="middle" class="scr">image_change.py</text>
  <rect x="416" y="300" width="178" height="88" rx="8" class="nul"/>
  <text x="505" y="322" text-anchor="middle" class="ttl">Thresholds</text>
  <text x="505" y="342" text-anchor="middle" class="sub">noise tails of a pair of</text>
  <text x="505" y="357" text-anchor="middle" class="sub">passes with nothing moved</text>
  <text x="505" y="378" text-anchor="middle" class="scr">null_tails.json</text>
  <path d="M194,234 L214,234" class="ln"/>
  <path d="M394,234 L414,234" class="ln"/>
  <path d="M305,278 L305,298" class="ln"/>
  <path d="M505,300 L505,280" class="ln"/>
  <path d="M416,344 L396,344" class="ln"/>

  <text x="739" y="182" class="lbl">TRACK 1: NAVIGABLE SPLAT</text>
  <rect x="634" y="190" width="184" height="88" rx="8" class="t1"/>
  <text x="726" y="212" text-anchor="middle" class="ttl">3D Gaussian Splatting</text>
  <text x="726" y="232" text-anchor="middle" class="sub">Inria 3DGS, 30k iterations</text>
  <text x="726" y="247" text-anchor="middle" class="sub">on the frames of one pass</text>
  <text x="726" y="268" text-anchor="middle" class="scr">train.py (external)</text>
  <rect x="840" y="190" width="184" height="88" rx="8" class="t1"/>
  <text x="932" y="212" text-anchor="middle" class="ttl">Georeferenced splat</text>
  <text x="932" y="232" text-anchor="middle" class="sub">UTM splat + local view.ply,</text>
  <text x="932" y="247" text-anchor="middle" class="sub">fitted onto the DTM</text>
  <text x="932" y="268" text-anchor="middle" class="scr">georef_splat.py</text>
  <path d="M818,234 L838,234" class="ln"/>

  <rect x="634" y="312" width="14" height="14" rx="3" class="new"/>
  <text x="656" y="323" class="sub">stages compared in this repository: incremental vs global SfM,</text>
  <text x="656" y="339" class="sub">GPS-only vs gravity-levelled georeferencing (compare_mappers.py)</text>
  <rect x="634" y="352" width="14" height="14" rx="3" class="nul"/>
  <text x="656" y="363" class="sub">set once, on the object-free pair, and frozen for the test pair</text>
</svg>
